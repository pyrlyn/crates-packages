[package]
name = "abi-drift"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Regenerate cbindgen and csbindgen output and diff it, with a BLESS escape hatch"
license.workspace = true
repository = "https://github.com/pyrlyn/crates-packages"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
cbindgen = { version = "0.29.4", default-features = false }
csbindgen = "1.9.8"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
