[package]
name = "layered-config"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Load TOML configuration from ordered layers, later layers winning"
license.workspace = true
repository = "https://github.com/pyrlyn/crates-packages"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
serde = "1.0"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
tempfile = "3"
