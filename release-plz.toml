# release-plz writes the version and the changelog, and nothing else: bump.yml
# (pyrlyn/infra bump.yml) runs `release-plz update` with this file, lands the
# result through a pull request merged by rebase once the required checks are
# green, and only then tags the landed commit and creates the release.
#
# No tags and no GitHub releases from release-plz (`git_tag_enable` and
# `git_release_enable` off): bump is the only tagger, and the `release` /
# `release-pr` commands are never run.
#
# Unlike ketch, the crates here ARE published to crates.io, so the registry
# lookup stays on: it is the source of truth for what was released.

[workspace]
git_release_enable = false
git_tag_enable = false

# `file-backup` was never published to crates.io, so the registry lookup comes
# back empty and release-plz concludes it can diff against nothing — same trap
# ketch's release-plz.toml documents. Git tags are the only record that a
# release happened, which release.yml now makes literally true: it creates the
# tag by publishing the release.
git_only = true

# Below 1.0 release-plz sends a `feat:` to the patch. A new feature is worth
# more than a third digit to someone deciding whether to upgrade, 1.0 or not.
features_always_increment_minor = true

# One tag per crate: release.yml derives `file-backup-v<version>` from
# `file-backup/Cargo.toml`, and the changelog headings link to the release page.
git_tag_name = "{{ package }}-v{{ version }}"

[changelog]
# release-plz writes this header only when it creates CHANGELOG.md; on an
# existing file it keeps whatever sits above `## [Unreleased]`. So the file's
# header was aligned to this once — change it here, then in the file, never
# only there.
header = """# Changelog

<!-- Generated by release-plz from conventional commits. Do not edit it by hand: an entry comes from a commit message, and this header from [changelog] header in release-plz.toml. -->

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

## [Unreleased]
"""

# From the second release onwards, release-plz points a version heading at the
# diff against the previous tag. The release page is the useful destination: it
# is what someone reading the changelog is looking for.
# NOTE: This is a TOML literal string, so TOML preserves backslashes. The regex
# receives `\\.` to match a literal dot.
postprocessors = [
  { pattern = 'https://github\.com/listepo/crates-packages/compare/[^)\s]*\.\.\.([^)\s]*)', replace = "https://github.com/listepo/crates-packages/releases/tag/${1}" },
]
