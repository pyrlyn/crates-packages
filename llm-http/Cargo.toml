[package]
name = "llm-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "HTTP plumbing for LLM provider wires: credential lookup, auth headers, error mapping, retry with backoff and SSE framing"
license = "GPL-3.0-or-later OR LicenseRef-Royalty-Free"
repository = "https://github.com/pyrlyn/crates-packages"
keywords = ["llm", "http", "sse", "retry", "keyring"]
categories = ["api-bindings", "asynchronous"]
readme = "README.md"
exclude = ["AGENTS.md", "done.md", "ideas.md", "justfile", "plan.md", "roadmap.md", "todo.md", "toolchain.md"]

[dependencies]
llm-wire = { path = "../llm-wire", version = "0.1.0" }
bytes = "1"
eventsource-stream = "0.2.3"
futures = "0.3"
keyring = "4"
# Only what the plumbing needs: the client builder, headers and status codes.
# The wire crates that send requests enable `json` and `stream` themselves.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1.0"
tokio = { version = "1", default-features = false, features = ["sync", "time", "macros"] }
tokio-util = "0.7"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "sync"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
