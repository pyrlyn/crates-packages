name: release-plz

# Every merge to main keeps one pull request up to date: the next version, and
# the changelog entry for it, both derived from the conventional commits since
# the last tag. Merging that pull request is the release — release.yml
# publishes to crates.io and only then creates the tag.
#
# The flow is listepo/infra's release-plz.yml. Nothing here tags anything,
# publishes anywhere or dispatches a workflow (`release-workflow: ""`): only
# `release-pr` is run, and release.yml acts on the merge push itself. While
# `file-backup-v<version>` is not tagged yet (a release in flight) the release
# pull request is left alone.
#
# RELEASE_PLZ_TOKEN (fine-grained PAT or GitHub App token, contents and pull
# requests read/write) is required: a pull request opened with GITHUB_TOKEN
# starts no workflow, so it would be merged with no checks.
# See https://release-plz.dev/docs/github/token
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-plz:
    uses: listepo/infra/.github/workflows/release-plz.yml@189816ac5a375e18e0235044970efcbc40e3cabd
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      tag-prefix: file-backup-v
      package: file-backup
      release-workflow: ""
      # No mise.toml here: cargo comes from rust-toolchain.toml via rustup.
      mise: false
    secrets:
      RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
