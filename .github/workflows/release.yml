name: release

# The release build. It never tags and never starts itself: bump.yml
# (Actions -> Bump and release, pyrlyn/ci bump.yml) is the only way to a
# release and the only thing that creates a `file-backup-v*` tag. bump runs
# `release-plz update`, opens a pull request with the one version commit,
# rebase-merges it once every required check is green, tags the commit that
# landed on main, creates a *draft* release with the CHANGELOG.md section and
# dispatches this workflow with `--ref <tag> -f tag=<tag>` (a tag pushed with
# GITHUB_TOKEN starts no workflow, so the dispatch is explicit).
#
# Here: the gate again on the tagged commit, crates.io, then the draft is
# published. A failed run leaves the tag and a draft; re-run it with the same
# tag (an "already published" crate is accepted on a re-run).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag bump.yml created (file-backup-vX.Y.Z); run with --ref <tag>"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# One release at a time; cancelling a run halfway could leave a draft behind.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The run must be on the tag bump created, and the tag must name the
  # version in `file-backup/Cargo.toml`.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      publish: ${{ steps.decide.outputs.publish }}
      ref: ${{ steps.decide.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Is this run on the release tag?
        id: decide
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | sed -n 's/.*"name":"file-backup","version":"\([^"]*\)".*/\1/p')"
          if [ -z "$version" ]; then
            echo "could not read the version out of file-backup/Cargo.toml" >&2
            exit 1
          fi
          if [ "$TAG" != "file-backup-v$version" ]; then
            echo "tag $TAG does not match file-backup/Cargo.toml ($version)" >&2
            exit 1
          fi
          ref="$(git ls-remote origin "refs/tags/${TAG}^{commit}" | awk '{print $1; exit}')"
          [ -n "$ref" ] || ref="$(git ls-remote origin "refs/tags/${TAG}" | awk '{print $1; exit}')"
          if [ "$ref" != "$GITHUB_SHA" ]; then
            echo "$TAG is ${ref:-missing}, this run is $GITHUB_SHA: dispatch with --ref $TAG" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$TAG"
            echo "ref=$ref"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"

  # Nothing is published unless the same gate CI applies is green. A release is
  # the one build people cannot re-run themselves.
  verify:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  # crates.io first: the tag and the GitHub release are the record of a
  # completed publish, not a promise of one.
  crates-io:
    needs: [version, verify]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: Swatinem/rust-cache@v2
      - name: Publish file-backup
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set: a crates.io API token." >&2
            exit 1
          fi
          set +e
          # cargo publish needs the registry credentials as a real config file:
          # the env var alone authenticates `cargo login`, not `cargo publish`.
          mkdir -p "$HOME/.cargo"
          printf '[registry]\ntoken = "%s"\n' "$CARGO_REGISTRY_TOKEN" > "$HOME/.cargo/credentials.toml"
          cargo publish -p file-backup --locked > publish.log 2>&1
          status=$?
          set -e
          cat publish.log
          if [ $status -eq 0 ]; then
            exit 0
          fi
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ] && grep -q "already published" publish.log; then
            echo "already on crates.io; continuing"
            exit 0
          fi
          exit $status

  publish:
    needs: [version, verify, crates-io]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - "$VERSION" << 'PYEOF'
          import re, sys
          version = sys.argv[1]
          text = open('CHANGELOG.md').read()
          start = text.find('## [%s]' % version)
          notes = ''
          if start != -1:
            rest = text[start:].split('\n', 1)[1]
            out = []
            for line in rest.splitlines():
              if line.startswith('## '):
                break
              out.append(line)
            notes = '\n'.join(out).strip()
          open('notes.md', 'w').write(notes)
          print('notes: %d chars' % len(notes))
          PYEOF
          # bump.yml created the draft (with the CHANGELOG.md notes) on the tag.
          gh release view "$TAG" --json tagName >/dev/null \
            || { echo "no release $TAG: start releases with bump.yml" >&2; exit 1; }
          if [ -s notes.md ] && [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
            gh release edit "$TAG" --notes-file notes.md
          fi
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json tagName,isDraft --jq '"published \(.tagName) draft=\(.isDraft)"'
