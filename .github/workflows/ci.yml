name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # release-plz derives the next version and the changelog from these messages,
  # so a pull request's subjects are linted here. Pushes to main skip this:
  # every commit there arrived through a pull request that already passed it.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Conventional commits
        run: |
          base="origin/${{ github.base_ref }}"
          # A range that does not resolve must be an error: rev-list would
          # print nothing, the loop would see no commits, and a broken check
          # would pass itself.
          git rev-parse -q --verify "$base^{commit}" > /dev/null \
            || { echo "base branch $base not found" >&2; exit 1; }
          echo "linting $(git rev-list --count --no-merges "$base..HEAD") commit(s) from $base"
          bad=0
          for sha in $(git rev-list --no-merges --reverse "$base..HEAD"); do
            subject=$(git log -1 --format=%s "$sha")
            # Same passthrough as ketch: git writes reverts in its own format,
            # not as conventional commits.
            case "$subject" in
              "Revert "*) continue ;;
            esac
            echo "checking $sha: $subject"
            if ! printf '%s' "$subject" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'; then
              echo "not a conventional commit: $sha $subject" >&2
              bad=1
            fi
          done
          exit $bad

  # Rust CI from the shared listepo/infra ci-rust.yml, pinned by commit: fmt once, then per
  # target of its shared matrix clippy, check and the tests where the runner executes the
  # target (Linux x86_64 and aarch64, macOS aarch64, Windows x86_64: file-backup is std-only and
  # shared by ketch and rtok on all three platforms) or a build where it does not (macOS
  # x86_64). Rust is the rust-toolchain.toml pin (no mise.toml here), checked against rustc.
  rust:
    uses: listepo/infra/.github/workflows/ci-rust.yml@189816ac5a375e18e0235044970efcbc40e3cabd
    with:
      # rust-toolchain.toml's `1.86`, as the full version rustc reports.
      rust-version: "1.86.0"
      clippy-args: --workspace --locked
      # Publishing happens only from release.yml on a version-bump merge. Every other run just
      # proves the crate is publish-ready, so a broken publish breaks here, not at release time.
      test-command: |
        cargo test --workspace --locked $FEATURE_ARGS
        if [ "$TARGET" = x86_64-unknown-linux-gnu ]; then
          cargo publish --dry-run -p file-backup --locked
        fi
      build-command: cargo build --workspace --all-targets --locked $FEATURE_ARGS --target "$TARGET"
