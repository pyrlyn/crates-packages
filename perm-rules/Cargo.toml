[package]
name = "perm-rules"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Permission rules for tool calls: Claude Code's Tool(subject) grammar, deny > allow > ask decision order and a risk fallback"
license = "GPL-3.0-or-later OR LicenseRef-Royalty-Free"
repository = "https://github.com/pyrlyn/crates-packages"
keywords = ["permissions", "agent", "rules", "policy"]
categories = ["authentication", "development-tools"]
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
globset = "0.4.20"
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.11"
rstest = "0.27"
