[package]
name = "mcp-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "MCP client host: .mcp.json discovery, fail-open connect_all, OAuth with an injectable token store, elicitation mapping and deferred tools over rmcp"
license = "GPL-3.0-or-later OR LicenseRef-Royalty-Free"
repository = "https://github.com/pyrlyn/crates-packages"
keywords = ["mcp", "client", "oauth", "agent"]
categories = ["development-tools"]
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[features]
# The OS keyring as a token store; off by default so a host that injects its
# own store does not build the platform keychain bindings.
keyring = ["dep:keyring"]

[dependencies]
async-trait = "0.1"
# `auth` is the OAuth flow; the transports are added with the client.
rmcp = { version = "3.2", features = ["client", "auth"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "rt", "time"] }
keyring = { version = "4", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros"] }
